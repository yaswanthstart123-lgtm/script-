<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureHub - Login & Registration</title>
    <!-- Use Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-wrapper glass">
        <div class="auth-header">
            <h1>SecureHub</h1>
            <p>Access the ultimate quiz platform</p>
        </div>

        <div class="tabs">
            <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button id="tab-register" class="tab-btn" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form active">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" required placeholder="john.doe@example.com">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <div id="login-error" class="error-msg"></div>
            <button type="submit" class="btn primary-btn">Login</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form hidden">
            <div class="form-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" required placeholder="john.doe@example.com">
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label for="reg-role">Role</label>
                <select id="reg-role" required>
                    <option value="student">Student</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div id="reg-error" class="error-msg"></div>
            <div id="reg-success" class="success-msg"></div>
            <button type="submit" class="btn primary-btn">Create Account</button>
        </form>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => {
                f.classList.remove('active');
                f.classList.add('hidden');
            });

            document.getElementById(`tab-${tab}`).classList.add('active');
            const form = document.getElementById(`${tab}-form`);
            form.classList.remove('hidden');
            form.classList.add('active');
        }
    </script>
</body>
</html>
